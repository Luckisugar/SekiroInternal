; Precise Deflect Flash settings. Change a value, save, then press F8 in game to apply it (no restart needed).
; Times are in milliseconds (1000 ms = 1 second). Colours are R, G, B, A from 0 to 1.
; Keys that are not listed here keep the mod's built-in default.

[Cue]
; 0 turns the whole mod display off. F7 does the same while playing.
Enable=1
; F7 turns everything on and off. F8 reloads this file. F9 pauses the timing coach for this session.
ToggleKey=F7
ReloadKey=F8

; --- what to show (1 = on, 0 = off) -------------------------------------------------
Diamond=1
BeatBar=0
Banner=0
Feedback=0
FeedbackMs=0
ComboTips=0
FightSummary=0
Sound=0
RePressHint=1
FocusDot=1
StartupNote=1
CueSweeps=1
CueGrabs=1
CuePerilous=1

; --- your buttons -------------------------------------------------------------------
GuardKey=RMB
AttackKey=LMB
GuardButton=LB
AttackButton=RB

; --- timing -------------------------------------------------------------------------
PressLeadMs=200
JumpLeadMs=160
DodgeLeadMs=160
WindowAfterMs=100
ShowAheadMs=1000
ContactDelayMs=50
LearnTiming=1

; --- timing coach --------------------------------------------------------------------
Coach=1
PersonalMaxMs=100
PersonalMaxEarlyMs=40
CueJitterMs=20
CoachAlerts=1

TextSoon=TOO SOON

[Logger]
; Writes a detailed log of your fights to PreciseDeflectFlash\logs. Only needed for bug reports. 0 = off.
Enabled=0
; Key that writes a marker into the log (121 = F10).
MarkerKey=121
; Beeps when the mod is ready in game. 0 = off.
Beep=0
Dumps=0
CopyEnemyFiles=0

[Loader]
; Left empty. This key only runs from DirectInput8Create, which this chain never calls.
; SekiroInternal is loaded by SekiroPerf's AlsoLoad after the upscaler is in place.
ChainDInput8=
; 1 = always read enemy data from the game's Data files, even if you have unpacked chr and param folders. Leave at 0.
ForceArchives=0
